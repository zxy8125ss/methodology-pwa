name: Validate Data

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'shared/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'data/**'
      - 'shared/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN_DATA: ${{ secrets.DATA_REPO_TOKEN }}
      GITHUB_OWNER: ${{ vars.GITHUB_OWNER || 'zxy8125ss' }}
      GITHUB_REPO: ${{ vars.GITHUB_REPO || 'methodology-data' }}
      DATA_REPO_BRANCH: ${{ vars.DATA_REPO_BRANCH || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schema
        run: npx tsx scripts/validate-data.ts

      - name: Build indexes
        run: npx tsx scripts/build-index.ts
