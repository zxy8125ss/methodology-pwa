name = "methodology-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 站点代码通过 VITE_API_BASE 指向本 Worker
# 本地开发：npm run worker:dev（默认 8787 端口）

[observability]
enabled = true

# ---------------------------------------------------------------------------
# 环境变量（非敏感）
# ---------------------------------------------------------------------------
[vars]
GITHUB_OWNER = "zxy8125ss"
GITHUB_REPO = "methodology-data"
DATA_REPO_BRANCH = "main"
RATE_LIMIT_PER_MINUTE = "60"

# ---------------------------------------------------------------------------
# 敏感环境变量 —— 通过 `wrangler secret put <NAME>` 设置，绝不写入本文件
#
#   wrangler secret put GITHUB_TOKEN      # 数据仓 PAT（repo 权限）
#   wrangler secret put APP_TOKEN        # 前端调用令牌
#   wrangler secret put ANTHROPIC_API_KEY # Claude（深度研究）
#   wrangler secret put DEEPSEEK_API_KEY  # DeepSeek（日常问答，省钱）
#   wrangler secret put OPENAI_API_KEY    # 可选
#   wrangler secret put TAVILY_API_KEY    # 可选，联网搜索增强
#   wrangler secret put BRAVE_API_KEY     # 可选，联网搜索增强
# ---------------------------------------------------------------------------

# 生产环境
[env.production]
name = "methodology-worker-prod"

[env.production.vars]
GITHUB_OWNER = "zxy8125ss"
GITHUB_REPO = "methodology-data"
DATA_REPO_BRANCH = "main"
RATE_LIMIT_PER_MINUTE = "60"
